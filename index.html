  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      background: url('https://lh3.googleusercontent.com/d/1yitCdxlELKysNDtqmhgNXpdGCNseIHRS') no-repeat center center fixed;
      background-size: cover;
      color: #2b1e23;
      text-align: center;
      padding: 20px 10px;
      position: relative;
      overflow-x: hidden;
    }

    .hidden {
      display: none !important;
    }

    /* ANIMASI FADE-IN SAAT PINDAH HALAMAN */
    .fade-in {
      animation: fadeIn 0.5s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.98);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ANIMASI GOYANG / MELAYANG UNTUK MEMO CARD */
    @keyframes floatMemo {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(0.8deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
